name: ci

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.2"
          cache: pip
      - run: pip install -e '.[test]'
      - run: ruff check src scripts/download_data.py scripts/verify_freeze.py scripts/reproduce_tables.py scripts/reproduce_figures.py scripts/rerun_baselines.py scripts/rerun_campaigns.py scripts/build_zenodo_archive.py tests --exclude tests/legacy
      - run: pytest -q
        env:
          NO_PROXY: "*"
          HTTP_PROXY: "http://127.0.0.1:9"
          HTTPS_PROXY: "http://127.0.0.1:9"
